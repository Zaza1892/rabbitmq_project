# docker-compose.yml
#
# Runs the full pipeline as 4 containers: RabbitMQ (message queue),
# Postgres (storage), mock-api (fake tenant-lookup service), and
# consumer (the actual listener/agent).
#
# Healthchecks ensure the consumer only starts once RabbitMQ, Postgres,
# and mock-api are genuinely ready to accept connections, not just
# "started" - this avoids startup-timing crashes.


############################################################

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

############################################################

  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.mockapi
    container_name: mock-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

############################################################

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

############################################################

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consumer
    depends_on:
      rabbitmq:
        condition: service_healthy
      mock-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      API_URL: http://mock-api:8000/lookup
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-device_lookups}
      DB_USER: ${POSTGRES_USER:-appuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
    env_file:
      - .env
############################################################


volumes:
  postgres_data: